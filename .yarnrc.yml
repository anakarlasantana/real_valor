# =============================================================================
# Yarn do workspace (a raiz do repositorio) — G5
# =============================================================================
# O install é UNICO: `yarn install` na raiz resolve os dois apps e o pacote
# `packages/contrato`, e escreve UM `yarn.lock`. Os `frontend/` e `backend/`
# nao tem mais `.yarnrc.yml`, `.yarn/` nem lockfile proprios — rodar `yarn`
# dentro deles sobe ate aqui de qualquer forma (e' assim que o Yarn acha o
# projeto), entao manter uma copia la seria uma segunda configuracao para
# divergir.
#
# `nodeLinker: node-modules` porque os dois apps contam com `node_modules`
# real: o Medusa resolve modulos por caminho (o `admin.sources` compila o CRM
# de `/app/admin`) e o `next build` empacota o que o `node_modules` diz.
#
# `enableGlobalCache: false` e `compressionLevel: mixed` sao os mesmos que o
# storefront usava: o cache fica em `.yarn/cache` (dentro do repo, ignorado
# pelo Git e pelo `.dockerignore`) e os tarballs maiores ficam comprimidos.
compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.12.0.cjs
