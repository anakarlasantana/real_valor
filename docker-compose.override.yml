# =============================================================================
# Real Valor — Docker Compose (OVERLAY de DESENVOLVIMENTO)
# =============================================================================
# ATENCAO — este arquivo NAO e carregado por acidente. O Docker Compose le,
# POR CONVENCAO, `docker-compose.yml` + `docker-compose.override.yml` quando
# nenhum `-f` e informado. Informar `-f` DESLIGA essa convencao. E exatamente
# essa diferenca que separa os dois modos:
#
#     docker compose up -d                          -> DESENVOLVIMENTO (este)
#     docker compose -f docker-compose.yml up -d     -> PRODUCAO (sem este)
#
# O Makefile encapsula os dois para nao haver duvida:
#     make up            # DEV   (docker compose up -d)
#     make up PROD=1     # PROD  (docker compose -f docker-compose.yml up -d)
#
# Nao existe mais `start.sh`/`stop.sh`, `--env-file`, nem
# `docker-compose.dev.yml`/`docker-compose.prod.yml`: a base e UNICA e o modo
# dev e este overlay. O Compose le o `.env` da raiz automaticamente.
#
# -----------------------------------------------------------------------------
# O QUE ESTE OVERLAY MUDA (e por que)
# -----------------------------------------------------------------------------
# 1. ESTAGIO `dev` DOS DOIS REPOS (`target: dev`).
#    Os Dockerfiles sao multi-stage e o ULTIMO estagio e sempre o de producao
#    (`runner`, enxuto, sem devDependencies). Se o estagio nao fosse fixado,
#    `docker compose up` construiria a imagem de PRODUCAO e depois tentaria
#    rodar `yarn dev` nela — que e justamente o bug de "perfil errado" que esta
#    base foi feita para nao repetir.
#      backend  -> estagio `dev`  (mantem ts-node/devDependencies: `medusa
#                                  develop` compila `medusa-config.ts` em runtime)
#      frontend -> estagio `dev`  (COPIA do codigo-fonte + devDependencies:
#                                  o `runner` standalone nao tem os binarios de
#                                  dev nem o Yarn 4 exigido por `packageManager`)
#
# 2. COMANDOS DE DEV — modo watch em vez do artefato compilado:
#      backend  -> `yarn dev`  = `medusa develop` (watch + hot reload + admin Vite)
#      frontend -> `yarn dev`  = `next dev --turbopack -p 8000`
#
# 3. BIND MOUNTS DO CODIGO — o codigo do HOST entra no container, que e o que
#    torna o hot reload util: editar no host reflete no container. Em producao
#    nada disso existe; a imagem imutavel e a fonte da verdade.
#
# 4. VOLUME ANONIMO PARA node_modules — ponto CRITICO.
#    `./backend:/app` esconderia o `node_modules` construido DENTRO da imagem
#    (com binarios compilados para a plataforma do container), substituindo-o
#    pelo do host. Se o host for outra plataforma/libc (ex.: macOS/glibc vs
#    alpine/musl), os binarios ficam incompativeis e nada sobe.
#    O volume anonimo declarado DEPOIS do bind mount tem precedencia e preserva
#    o `node_modules` da imagem, isolando-o do bind mount.
#
# 5. NODE_ENV=development — habilita mensagens de erro detalhadas, o admin do
#    Medusa em modo de desenvolvimento e o hot reload do Next. O Medusa so
#    serve o admin COMPILADO quando NODE_ENV=production — por isso producao
#    nunca usa este overlay.
#
# 6. `RUN_MIGRATIONS=0` por padrao: migrations sao aplicadas UMA vez, de
#    proposito (`make migrate`), para nao rodar em todo restart do container.
#    O banco de dev fica estavel e o `seed` continua valido.
#
# 7. TAG DE IMAGEM PROPRIA (`real_valor_*:dev`). A base usa
#    `real_valor_*:${REAL_VALOR_TAG:-local}`; se o dev escrevesse na MESMA tag,
#    um `docker compose up` em dev reaproveitaria silenciosamente a imagem de
#    producao (os dois modos nunca reconstroem o que ja existe) e o dev rodaria
#    codigo de producao — ou vice-versa. Tags distintas mantem os dois modos
#    independentes na mesma maquina.
#
# 8. Limites de recurso proprios: `next dev --turbopack` + `medusa develop`
#    consomem mais memoria que os processos de producao, mas continuam
#    limitados para nao derrubar as outras stacks da maquina (`devops_*`).
#
# -----------------------------------------------------------------------------
# POR QUE `yarn dev` FUNCIONA SEM RECONSTRUIR A IMAGEM
# -----------------------------------------------------------------------------
# Os binarios (`medusa`, `next`) ja estao em `node_modules` dentro da imagem e
# ficam acessiveis via PATH. O bind mount substitui apenas o codigo-fonte.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Backend em modo desenvolvimento
  # ---------------------------------------------------------------------------
  backend:
    build:
      # A raiz do repositorio (ver o `context` na base): o CRM vive em `admin/`,
      # irmão do backend, e entra na imagem em `/app/admin`.
      context: .
      dockerfile: backend/Dockerfile
      # `dev` preserva as devDependencies (ts-node), obrigatorias para o
      # `medusa develop` carregar `medusa-config.ts` e os modulos TypeScript.
      # O estagio `runner` (producao) e enxuto e NAO serve para dev.
      target: dev
    image: real_valor_backend:${REAL_VALOR_TAG:-dev}
    # `medusa develop` = modo dev do Medusa v2 (watch + hot reload + admin Vite).
    command: ["yarn", "dev"]
    environment:
      NODE_ENV: development
      # Em dev as migrations NAO rodam a cada restart — aplique sob demanda
      # com `make migrate`. Evita reexecutar migracoes a cada `up`.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
      # Porta do WebSocket de HMR do Vite do admin. Sem ela, o
      # `@medusajs/admin-bundler` SORTEIA uma porta livre (`getPort()`), e essa
      # porta existe so DENTRO do container — o `@vite/client` servido ao
      # browser passa a apontar para `ws://localhost:<porta sorteada>/painel/`
      # e o HMR nunca conecta. Sem HMR o Vite nao dispara o full reload que
      # acompanha a re-otimizacao de `node_modules/.vite/deps`: a aba fica
      # presa no grafo antigo e os imports dinamicos passam a apontar para
      # chunks que nao existem mais -> "Error loading dynamically imported
      # module" no painel. Publicada logo abaixo (dev so liga o que esta aqui).
      #
      # NAO existe "desligar o HMR": o `getViteConfig` do admin-bundler chama
      # `getHmrConfig(hmrPort)` SEMPRE, e sem `HMR_PORT` volta a sortear. O que
      # da' para escolher e' o ENDERECO ANUNCIADO ao browser — as duas proximas.
      HMR_PORT: 9001
      # Porta que o `@vite/client` anuncia no `socketHost`
      # (`@medusajs/admin-bundler` le `HMR_CLIENT_PORT` em `getHmrConfig`).
      #
      # ⚠️ VAZIO POR PADRAO — e isso NAO e' descuido. O `@vite/client` faz
      # `port = clientPort || port`, entao VAZIO = usa a `HMR_PORT` (9001), que e'
      # o comportamento nativo do painel em `localhost:9000`. So' o tunel precisa
      # de outro valor, e quem o escreve e' o `scripts/tunnel.sh` (`make tunnel`),
      # que grava `443` no `.env` e o remove no `make tunnel-stop`.
      #
      # NAO coloque 443 aqui por padrao. Medido em 2026-10-19: com 443 fixo, o
      # painel LOCAL entra em REFRESH AUTOMATICO em laco. O socket primario
      # (`ws://localhost:443/painel/`) falha, o cliente cai em
      # `waitForSuccessfulPing`, que faz `fetch("http://localhost:443/painel/")`
      # com `mode: no-cors` — e nesta maquina o 443 e' de OUTRO servidor, que
      # responde **404**. O `fetch` nao lanca (404 e' resposta valida para
      # no-cors), o ping se declara bem-sucedido e o cliente executa
      # `location.reload()`, recomecando o ciclo a cada ~1s.
      #
      # PELO TUNEL (`443`) o mesmo valor esta' correto: o ngrok atende so' no 443
      # do proprio dominio e o documento e' `https`, entao `wss://<host>:443/`
      # acerta o TLS do tunel no primeiro try.
      HMR_CLIENT_PORT: ${HMR_CLIENT_PORT:-}
      # `wss` so' quando o tunel esta' ativo. Tambem vazio por padrao, para o
      # painel local continuar em `ws://` (o `import.meta.url` de
      # `http://localhost:9000` decide). Fixo em `wss`, o socket LOCAL sairia
      # como `wss://localhost:9001` num documento `http` e a maquina de
      # desenvolvimento precisaria de um certificado que nao tem.
      HMR_PROTOCOL: ${HMR_PROTOCOL:-}
    # WebSocket de HMR do Vite do admin (par do HMR_PORT acima). A lista de
    # `ports` do Compose CONCATENA base + override, entao o 9000:9000 da base
    # continua publicado.
    #
    # Publicada em LOOPBACK de proposito: serve ao painel aberto em
    # `localhost:9000` e ao `@vite/client` local, e nao ha' motivo para um
    # servidor de desenvolvimento ficar alcancavel pela rede da maquina.
    #
    # O TUNEL NAO PUBLICA ESTA PORTA, e o HMR NAO ATRAVESSA o tunel: o ngrok
    # free nao transporta o upgrade WebSocket (medido em 2026-10-19; o mesmo
    # cliente direto aqui responde 101). Quem abre o painel pelo endereco
    # publico usa o painel SEM hot reload — e por isso `HMR_CLIENT_PORT` e
    # `HMR_PROTOCOL` ficam VAZIOS tambem durante o tunel: preenche-las com
    # `443`/`wss` atinge o painel local e o poe em refresh em laco (o 443 desta
    # maquina responde 404, e `no-cors` deixa o ping passar). O `scripts/tunnel.sh`
    # sobe o agente em 8000 e o `/painel` chega ao Vite pela reescrita do storefront.
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      # Codigo do host -> container (habilita o hot reload). Os caminhos sao os
      # da imagem desde o G5: a raiz do workspace e' `/app` e o backend vive em
      # `/app/backend` — a mesma arvore do repositorio.
      - ./backend/src:/app/backend/src
      # O CRM, pacote IRMAO do backend: o mesmo caminho da imagem
      # (`/app/admin`), que e' de onde o `admin.sources` do medusa-config.ts le a
      # fonte do painel. Dentro de `/app` de proposito: a resolucao de import do
      # Vite/Rollup parte da arvore do arquivo e precisa do `node_modules`
      # ACIMA dela.
      - ./admin:/app/admin
      # O CONTRATO, editado ao vivo: o backend o resolve pelo symlink de
      # workspace (`node_modules/@rv/contrato -> ../../packages/contrato`), entao
      # mexer em `packages/contrato/src/*.ts` recarrega o app sem reinstalar
      # nada — que e' o ponto do pacote no G5.
      - ./packages:/app/packages
      # Config e scripts tambem observados em dev.
      - ./backend/medusa-config.ts:/app/backend/medusa-config.ts:ro
      - ./backend/package.json:/app/backend/package.json:ro
      # O `tsconfig.json` do backend entra pelo mesmo motivo dos dois acima — e
      # e' ele que o `medusa build` le: o `make build-admin` compila DENTRO do
      # container. Sem este mount, o build le o arquivo da IMAGEM, que
      # envelhece. Medido em 2026-09-30: com o
      # `rewriteRelativeImportExtensions` ja no repositorio, o gate acusava
      # `error TS5096 ... Backend build completed with errors` a cada rodada —
      # o TypeScript do container e o MESMO do host (5.9.3), o que estava velho
      # era o arquivo (o do container, sem o flag). O frontend monta o
      # tsconfig dele pelo mesmo motivo (ver o servico `frontend`).
      - ./backend/tsconfig.json:/app/backend/tsconfig.json:ro
      # Uploads do painel: o MESMO volume de producao, no `static/` relativo ao
      # app (o `upload_dir` do `@medusajs/file-local`). Sem ele, o que o CRM
      # envia some toda vez que o container e' recriado (o `/app` daqui vem da
      # imagem, nao de um bind mount do host — ver os mounts acima).
      - real_valor_uploads:/app/backend/static
      # Volume ANONIMO: declarado por ULTIMO de proposito, para ter precedencia
      # sobre os bind mounts acima e preservar o node_modules da imagem.
      - /app/node_modules
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Frontend em modo desenvolvimento
  # ---------------------------------------------------------------------------
  frontend:
    build:
      # A raiz do repositorio, como a base (o storefront precisa do pacote do
      # contrato e da raiz do workspace).
      context: .
      dockerfile: frontend/Dockerfile
      # `dev` copia o codigo-fonte e mantem as devDependencies + o Yarn 4 do
      # projeto. O estagio `runner` (standalone) e enxuto de proposito e nao
      # tem o que o `next dev` precisa: usa-lo em dev foi o bug corrigido aqui.
      target: dev
    image: real_valor_frontend:${REAL_VALOR_TAG:-dev}
    # `next dev --turbopack -p 8000` (script `dev` do package.json).
    command: ["yarn", "dev"]
    environment:
      NODE_ENV: development
      # O Next precisa saber a origem para validar Server Actions em dev.
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8000}
      # Aponta o servidor dev para o backend da rede interna.
      MEDUSA_BACKEND_URL: ${MEDUSA_INTERNAL_BACKEND_URL:-http://backend:9000}
    volumes:
      # Codigo do host -> container. Isso SUBSTITUI o codigo copiado na imagem;
      # em dev o servidor e' o `next dev`, nao o `server.js` standalone.
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      # O CONTRATO, editado ao vivo — o mesmo pacote do backend (G5).
      - ./packages:/app/packages
      # Temas: em DEV a pasta e montada porque o `next dev` resolve o import do
      # `themes/default/theme.json` (`src/lib/theme.ts`) a cada compilacao. Em
      # producao ela nao existe na imagem: o import entra no bundle do build e o
      # tema da loja vem do payload (R5).
      - ./frontend/themes:/app/frontend/themes
      # Arquivos de configuracao do build do Next.
      - ./frontend/next.config.js:/app/frontend/next.config.js:ro
      - ./frontend/postcss.config.js:/app/frontend/postcss.config.js:ro
      - ./frontend/tailwind.config.js:/app/frontend/tailwind.config.js:ro
      - ./frontend/tsconfig.json:/app/frontend/tsconfig.json:ro
      - ./frontend/package.json:/app/frontend/package.json:ro
      # Volume ANONIMO (por ultimo): preserva o node_modules da imagem e evita
      # conflito de binarios entre host e container.
      - /app/node_modules
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M

